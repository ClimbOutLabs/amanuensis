    ref: 7066b58141d8cc66f39356b2ee5bb64d428dcf17 # tracks: main @ 2026-08-26
    description: Answer questions about a repository from its generated wiki (DeepWiki); companion to wiki-architect.

  # openai/skills — per-skill licenses (verified). Apache-2.0 unless noted.
