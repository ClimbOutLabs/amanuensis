# Shipped MCP catalog: server presets offered by
# GET /api/v1/catalog/mcp-servers for the UI to copy into
# PUT /api/v1/settings/mcp-servers bodies. Discovery-only — never executed against.
mcp_servers:
  - type: remote
    name: linear
    url: https://mcp.linear.app/mcp
    description: Search, read, and create Linear issues.
    auth:
      type: dcr
  - type: remote
    name: notion
    url: https://mcp.notion.com/mcp
    description: >-
      Search pages, read content, query databases, create pages. Signing in gives the
      connection the same access you have, so it can reach any page or database you can open.
    auth:
      type: dcr
  - type: remote
    name: sentry
    url: https://mcp.sentry.dev/mcp
    description: Search errors, read stack traces, and check releases.
    auth:
      type: dcr
  - type: remote
    name: deepwiki
    url: https://mcp.deepwiki.com/mcp
    description: Read documentation and ask questions about any public GitHub repository.
  - type: remote
    name: exa
    url: https://mcp.exa.ai/mcp
    description: Search the web, fetch page contents, and find similar pages.
    search_tools:
      - web_search_exa
      - web_fetch_exa
      - web_search_advanced_exa
  - type: remote
    name: parallel-web
    url: https://search.parallel.ai/mcp
    description: Free web search and page fetch. No API key needed. Added as your web search provider.
    search_provider: true
    search_tools:
      - web_search
      - web_fetch
    search_plumbing_fields:
      - session_id
      - model_name
  - type: remote
    name: github
    url: https://api.githubcopilot.com/mcp/
    description: >-
      Work with issues, pull requests, repository files, and CI status. Connect with a
      personal access token from your GitHub settings; give it only the repositories and
      permissions it needs.
    auth:
      type: header
      headers:
        Authorization: Bearer YOUR_GITHUB_PAT
  - type: remote
    name: tavily
    url: https://mcp.tavily.com/mcp
    description: Search the web, extract page content, and crawl sites. Needs your Tavily API key.
    search_provider: true
    search_tools:
      - tavily_search
      - tavily_extract
    auth:
      type: header
      headers:
        Authorization: Bearer YOUR_TAVILY_API_KEY
  - type: remote
    name: bright-data
    url: https://mcp.brightdata.com/mcp
    description: Search the web and scrape pages, including sites behind bot protection.
    auth:
      type: header
      headers:
        Authorization: Bearer YOUR_BRIGHT_DATA_API_TOKEN
  - type: remote
    name: supabase
    url: https://mcp.supabase.com/mcp
    description: Run SQL queries, manage tables, and inspect Supabase projects.
    auth:
      type: dcr
  - type: remote
    name: stripe
    url: https://mcp.stripe.com
    description: Create and manage customers, payments, invoices, and subscriptions.
    auth:
      type: dcr
  - type: remote
    name: confluence
    url: https://mcp.atlassian.com/v1/mcp
    description: Search spaces, read pages, and create or update content.
    auth:
      type: dcr
  - type: remote
    name: jira
    url: https://mcp.atlassian.com/v1/mcp
    description: Search, read, create, and update Jira issues.
    auth:
      type: dcr
  - type: remote
    name: posthog
    url: https://mcp.posthog.com/mcp
    description: Query product analytics, run SQL, and manage feature flags.
    auth:
      type: dcr
  # Self-hosted, so the URL here is a placeholder: no logo either, since there is no hosted asset.
  - type: remote
    name: hindsight
    url: https://your-hindsight-host:8449/mcp/your-bank
    description: >-
      A self-hosted Hindsight long-term memory bank. The URL here is a placeholder: add it with
      Add MCP Server using your own Hindsight URL, which must have the shape {apiBase}/mcp/{bank}
      naming exactly one bank, or memory cannot use it. Put the API key in the Authorization
      header, and use one Hindsight accepts on its REST API as well as its MCP surface, because
      memory calls the REST API.
    auth:
      type: header
      headers:
        Authorization: Bearer YOUR_HINDSIGHT_API_KEY
  # The person's own Home Assistant, so the URL here is a placeholder: the connect form asks for
  # their address and long-lived access token, and builds this endpoint and the header itself.
  - type: remote
    name: home-assistant
    url: https://homeassistant.local:8123/mcp_server/sse
    description: >-
      See and control the Home Assistant devices you expose to voice assistants. Reads run on
      their own; changes ask first; locks, alarms and garage doors are never controlled.
    auth:
      type: header
      headers:
        Authorization: Bearer YOUR_HOME_ASSISTANT_TOKEN
