packages:
  - packages/*
  - mcp/*

minimumReleaseAge: 0
trustLockfile: true
confirmModulesPurge: false
allowBuilds:
  '@openuidev/lang-core': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  # Fern-generated SDK tests (packages/trueforge-sdk) run msw's postinstall.
  msw: true
  onnxruntime-node: false
  protobufjs: true

# Silence peer mismatches between trueforge-ui peers and the versions we pin.
peerDependencyRules:
  allowedVersions:
    '@truefoundry/assistant-ui-runtime': '0.1.37'

# One Context module for assistant-ui (avoids "requires an AuiProvider").
overrides:
  '@assistant-ui/store': '0.2.21'
  '@assistant-ui/core': '0.2.22'
  '@assistant-ui/react': '0.14.27'
  '@assistant-ui/tap': '0.9.5'
  zustand: '^5.0.14'
  # resolve@1.22.12 ships accidental .claude/ files that break installs under macOS sandbox.
  resolve: '1.22.11'
  # Rollup 4.63.0 OOMs the frontend Vite build (Monaco + compression plugin); stay on 4.62.x.
  rollup: '4.62.2'
  # googleapis-common@8.0.3 pins google-auth-library to exactly 10.5.0 while
  # mcp/gmail needs ^10.9.0; one 10.x keeps OAuth2Client types unified so the
  # vendored Gmail MCP server typechecks.
  google-auth-library: '^10.9.0'
  # Optional peer of @truefoundry/assistant-ui-runtime that ships no license.
  # The runtime patch drops its only import, so it is never installed.
  truefoundry-gateway-sdk: '-'
  # dompurify: monaco-editor never ships a patched version; pin to safe floor.
  'dompurify@3': '3.4.17'
  # undici@5: no 5.x patch exists; @actions/http-client pulls this in via mcp-evals devDep.
  'undici@5': '7.30.1'
  # @ag-ui/core: @openuidev/react-headless pins ^0.0.53 across all releases; 1.0.0 uses zod@4.
  '@ag-ui/core@0': '1.0.0'
  # zod@3: @anthropic-ai/sandbox-runtime pins ^3.24.1 and never moves to zod@4.
  'zod@3': '4.4.0'
  # @opentelemetry/resources@3.0.0 is vulnerable (AIKIDO-2026-461086 range 3.0.0-3.1.0);
  # @daytona/sdk@0.230.0 and its otel siblings all pin exactly 3.0.0.
  '@opentelemetry/resources@3': '3.1.1'

patchedDependencies:
  '@openuidev/react-lang@0.2.15': patches/@openuidev__react-lang@0.2.15.patch
  '@truefoundry/assistant-ui-runtime@0.1.37': patches/@truefoundry__assistant-ui-runtime@0.1.37.patch
