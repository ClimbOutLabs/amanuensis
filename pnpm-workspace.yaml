packages:
  - packages/*
  - mcp/*

minimumReleaseAge: 0
trustLockfile: true
confirmModulesPurge: false
allowBuilds:
  '@openuidev/lang-core': true
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  # Fern-generated SDK tests (packages/trueforge-sdk) run msw's postinstall.
  msw: true
  onnxruntime-node: false
  protobufjs: true

# Silence peer mismatches between trueforge-ui peers and the versions we pin.
peerDependencyRules:
  allowedVersions:
    '@truefoundry/assistant-ui-runtime': '0.1.37'

# One Context module for assistant-ui (avoids "requires an AuiProvider").
overrides:
  '@assistant-ui/store': '0.2.21'
  '@assistant-ui/core': '0.2.22'
  '@assistant-ui/react': '0.14.27'
  '@assistant-ui/tap': '0.9.5'
  zustand: '^5.0.14'
  # resolve@1.22.12 ships accidental .claude/ files that break installs under macOS sandbox.
  resolve: '1.22.11'
  # Rollup 4.63.0 OOMs the frontend Vite build (Monaco + compression plugin); stay on 4.62.x.
  rollup: '4.62.2'
  # googleapis-common@8.0.3 pins google-auth-library to exactly 10.5.0 while
  # mcp/gmail needs ^10.9.0; one 10.x keeps OAuth2Client types unified so the
  # vendored Gmail MCP server typechecks.
  google-auth-library: '^10.9.0'

patchedDependencies:
  '@openuidev/react-lang@0.2.15': patches/@openuidev__react-lang@0.2.15.patch
  '@truefoundry/assistant-ui-runtime@0.1.37': patches/@truefoundry__assistant-ui-runtime@0.1.37.patch
