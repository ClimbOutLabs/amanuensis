# Full-stack smoke test. Reads packages/trueforge/.env for secrets and
# credentials; in-network DB/Redis targets are opinionated here so they do not
# inherit host-dev localhost values. Postgres/Redis stay off the host network.
name: trueforge

services:
  postgres:
    image: postgres:17
    env_file:
      - path: packages/trueforge/.env
        required: true
    # Host 5433 avoids conflict with docker-compose.dev.yml on 5432. Bound to
    # loopback only: this is a debug port for the host machine, not for the network.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # -h forces a TCP probe. initdb's bootstrap server answers only on the
    # Unix socket, so without -h the check passes before the real server is
    # up and the app's first connection is refused.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Shared by all server replicas: carries executor peering (cross-replica
  # turn cancel via request-reply).
  redis:
    image: redis:7-alpine
    # Host 6380 avoids conflict with docker-compose.dev.yml on 6379. Bound to
    # loopback only: this is a debug port for the host machine, not for the network.
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Holds the network namespace that `server` and, with the login profile,
  # `dex` share, and publishes their ports. Sharing one namespace is what lets
  # the OIDC issuer https://localhost:5556/dex be the same URL for the browser
  # on the host and for the server verifying tokens. The namespace lives in
  # this idle container so either of the two can restart without stranding
  # the other in a dead namespace.
  loopback:
    image: alpine:3.21
    init: true
    command: ['sleep', 'infinity']
    ports:
      # Host 8791 avoids conflict with host `pnpm dev` on 8790. Published on
      # loopback only: the app binds 0.0.0.0 inside the container, and without
      # OIDC every request has the admin role (see docs/deployment-security.mdx).
      # To expose it beyond localhost, configure OIDC and publish explicitly.
      - '127.0.0.1:8791:8790'
      # Dex (login profile). Nothing listens here unless that profile runs.
      - '127.0.0.1:5556:5556'
    # Lets a custom model provider in the server reach a model server running
    # on the host (e.g. Ollama at http://host.docker.internal:11434/v1).
    # host-gateway is the Docker Engine special value for the host's own IP;
    # it resolves the same way on Linux, macOS, and Windows hosts. It lives
    # here because Docker rejects extra_hosts on a container that joins
    # another's namespace, and the joined containers read this hosts file.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # The calendar network is shared with the calendar connector only (see calendar-caldav).
    networks:
      - default
      - calendar
    restart: unless-stopped

  # Serves both the API and the UI on one port.
  server:
    build:
      context: .
      # From-source image; root Dockerfile is the npm-install prod recipe.
      dockerfile: Dockerfile.dev
    image: truefoundry-server:latest
    # The aman-stt sidecar owns cores 16-19 (see below); the server and its
    # in-process embedding workload stay on the remaining cores so a
    # transcription never steals latency from chat. Adjust both pins together
    # on hosts with a different core count (see docs/voice-input.mdx).
    cpuset: '0-15'
    # Ports are published by `loopback` above. Compose DNS therefore has no
    # `server` entry; other services reach this one as `loopback`.
    network_mode: 'service:loopback'
    environment:
      # Wins over env_file / image defaults so a host .env cannot flip this.
      NODE_ENV: production
      # The app sees HOST=0.0.0.0 inside the container, so the REQUIRE_AUTH
      # startup guard needs this explicit opt-out. The loopback-only port
      # mapping above is what keeps this stack's exposure local; production
      # deployments MUST configure OIDC instead of copying this.
      REQUIRE_AUTH: 'false'
      # Inside the container; host mapping above is 8791.
      PORT: 8790
      # Host-facing origin for MCP OAuth callbacks (mapped port, not container PORT).
      PUBLIC_BASE_URL: http://localhost:8791
      # Compose network hosts — do not use packages/trueforge/.env localhost values.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Compose runs one replica but keeps peering on so the peered cancel path
      # stays exercised. STANDALONE=false ⇒ Postgres + Redis.
      # A single-process deployment can set STANDALONE=true and drop redis.
      STANDALONE: 'false'
      REDIS_URL: redis://redis:6379
      # Markdown memory backend (default): local files under
      # MEMORY_MARKDOWN_DIR. Mounted on the persistent memory-data volume so
      # memories survive container recreates.
      MEMORY_MARKDOWN_DIR: /data/memory
      # Persona knowledge libraries (SQLite per persona) live under
      # PERSONA_KNOWLEDGE_DIR. Mounted on its own persistent volume so
      # libraries survive container recreates. The ~120 MB search model is
      # cached under MEMORY_EMBEDDINGS_MODEL_DIR (inside /data/memory), so it
      # is persistent too and downloads exactly once.
      PERSONA_KNOWLEDGE_DIR: /data/persona-knowledge
      # Local speech-to-text sidecar. The browser never talks to it directly;
      # the server forwards recorded WAV audio and degrades gracefully when
      # the sidecar is unreachable (typed chat keeps working).
      STT_URL: http://aman-stt:8001
      # Email send list the server writes, and the sidecar's status file it reads (see mail-email).
      MAIL_POLICY_FILE: /data/mail-policy/allowed_recipients.toml
      MAIL_POLICY_STATUS_FILE: /data/mail-policy-status/loaded.sha256
      # The sidecar's account agent, which the Settings Email card talks to (see mail-email).
      MAIL_EMAIL_ACCOUNT_URL: http://mail-email:9559
      # The calendar sidecar's account agent, which the Settings Calendar card talks to (see calendar-caldav).
      CALENDAR_ACCOUNT_URL: http://calendar-caldav:9560
      # Guards the calendar account port; the same value goes to calendar-caldav. There is no default: `pnpm smoke`
      # makes a random one for each run, and for plain `docker compose` set it in the shell (openssl rand -hex 32).
      CALENDAR_ACCOUNT_SECRET: ${CALENDAR_ACCOUNT_SECRET:?set CALENDAR_ACCOUNT_SECRET to a random value of 32 or more characters, for example from openssl rand -hex 32}
    # Secrets and Postgres credentials (POSTGRES_USER, …).
    # `environment` above overrides any colliding keys from this file.
    # TRUEFORGE_API_KEY is deliberately not overridden: set it here and the server and controller
    # share it; unset, hosted mode falls back to a well-known placeholder and warns at startup.
    env_file:
      - path: packages/trueforge/.env
        required: true
    # The login profile's self-signed Dex certificate lives here. Empty, and
    # unused, unless NODE_EXTRA_CA_CERTS in .env points into it.
    volumes:
      - dex-tls:/etc/dex-tls:ro
      # Persistent Markdown memory ; without this, memories vanish
      # on container recreate.
      - memory-data:/data/memory
      # Persistent persona knowledge libraries; without this, libraries vanish
      # on container recreate.
      - persona-knowledge-data:/data/persona-knowledge
      # The Email send list. The server is its only writer; the sidecar mounts it read-only.
      - mail-policy:/data/mail-policy
      - mail-policy-status:/data/mail-policy-status:ro
    depends_on:
      loopback:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Discovery retries in the background, but starting after Dex avoids a
      # first-request login retry page. Optional: without the profile the
      # entry is skipped.
      dex:
        condition: service_healthy
        required: false
    # Probes GET /healthz; node is already in the image.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Above the app's default GRACEFUL_TIMEOUT_SECONDS (30) so SIGKILL does not
    # cut off turn drain.
    stop_grace_period: 35s
    restart: unless-stopped

  # Local speech-to-text sidecar (faster-whisper, Whisper small int8, CPU-only).
  # The server forwards recorded WAV audio here and returns the transcript to
  # the browser. No host port is published: it is reachable only inside the
  # compose network, and the server degrades gracefully when it is down.
  aman-stt:
    build:
      context: ops/aman-stt
    image: amanuensis-aman-stt:latest
    # Dedicated cores, disjoint from the server's 0-15 pin above, so a
    # transcription never contends with chat or embedding work.
    cpuset: '16-19'
    mem_limit: 2g
    environment:
      # Whisper encoder threads; 4 matches the 4 pinned cores.
      AMAN_STT_CPU_THREADS: '4'
      # Model cache location; matches the stt-model-cache volume below.
      AMAN_STT_MODEL_DIR: /data/stt-cache
    volumes:
      # Persistent Whisper model cache; without this the ~464 MB model
      # downloads again on every container recreate.
      - stt-model-cache:/data/stt-cache
    # CPU-only by construction: the image has no CUDA userspace and the app
    # pins device=cpu. No GPU reservations here.
    restart: unless-stopped

  # Email connector sidecar. Private to the Compose network: `expose` only, never `ports`.
  # The server reaches it as http://mail-email:9557/mcp. The server has no login of its own,
  # so nothing outside this network may reach it.
  mail-email:
    image: ghcr.io/wh1isper/mcp-email-server@sha256:1c4d5333028a6b86867b5c73db121060086a8fb96e40ceb4262d14aae37f8852
    # The wrapper starts the sidecar on the send list the server writes, and restarts it when that list changes.
    entrypoint: ['/bin/sh', '/usr/local/bin/aman-mail-entrypoint']
    command: ['streamable-http', '--host', '0.0.0.0', '--port', '9557']
    environment:
      # Only requests addressed to this service name pass the DNS-rebinding check.
      MCP_ALLOWED_HOSTS: mail-email
      # Env-supplied accounts are read from the environment only. `plaintext` makes the
      # server never touch the OS keyring, and no account is written to the config file.
      MCP_EMAIL_SERVER_CREDENTIAL_STORAGE: plaintext
      # The send list the server owns. It is read-only here; the server is the only writer.
      MCP_EMAIL_SERVER_CONFIG_PATH: /policy/allowed_recipients.toml
      # Where the wrapper records the hash of the list it started with. The server waits on it.
      AMAN_MAIL_STATUS_FILE: /mail-status/loaded.sha256
      # The account agent: the account file it owns, its private-network port, and its own path in the image.
      AMAN_MAIL_ACCOUNT_FILE: /account/.env.mail-email
      AMAN_MAIL_ACCOUNT_PORT: '9559'
      AMAN_MAIL_ACCOUNT_AGENT: /usr/local/bin/aman-mail-account-agent
      AMAN_MAIL_EMAIL_CHECK: /usr/local/bin/aman-mail-email-check
      # Attachment content is read only so the server can hand it to the agent as data, never as instructions.
      MCP_EMAIL_SERVER_ENABLE_ATTACHMENT_CONTENT: 'true'
    volumes:
      - ./ops/compose/mail-email/entrypoint.sh:/usr/local/bin/aman-mail-entrypoint:ro
      - ./ops/compose/mail-email/account_agent.py:/usr/local/bin/aman-mail-account-agent:ro
      - ./ops/compose/mail-email/email_check.py:/usr/local/bin/aman-mail-email-check:ro
      # The account file itself, in a volume this sidecar owns, so the agent can save accounts the
      # Settings card sends. No host file is bound here: a missing bind source would be created as a
      # folder and break the account file, and a host-owned file is unreadable to this sidecar.
      - mail-account:/account
      - mail-policy:/policy:ro
      - mail-policy-status:/mail-status
      - mail-email-data:/data
    expose:
      - '9557'
      - '9559'
    restart: unless-stopped

  # Calendar connector sidecar (CalDAV). Built from ops/calendar-sidecar and private: `expose` only, never `ports`,
  # on its own network. The server reaches it as http://calendar-caldav:9558/mcp.
  # The calendar login lives in a volume this sidecar owns, which the Settings Calendar card saves
  # through the sidecar's account agent on port 9560. The tool server runs only while a login is saved.
  calendar-caldav:
    build:
      context: ./ops/calendar-sidecar
    environment:
      # Only these tools are offered. Writes need the confirm token, not an interactive prompt.
      CALDAV_ALLOW_TOOLS: list_calendars,list_events,get_event,search_events,create_event,update_event,delete_event,respond_to_event
      ELICITATION: 'false'
      # The account agent: the account file it owns and its private-network port.
      CALENDAR_ACCOUNT_FILE: /account/.env.calendar
      CALENDAR_ACCOUNT_PORT: '9560'
      # Only a caller that presents this secret can read, replace or remove the account (same value as the server).
      CALENDAR_ACCOUNT_SECRET: ${CALENDAR_ACCOUNT_SECRET:?set CALENDAR_ACCOUNT_SECRET to a random value of 32 or more characters, for example from openssl rand -hex 32}
    # A network of its own, shared with the app's `loopback` only, so the mail connector cannot reach the account port.
    networks:
      - calendar
    volumes:
      - calendar-account:/account
    expose:
      - '9558'
      - '9560'
    restart: unless-stopped

  # Schedule controller: runs the periodic control loops (schedule dispatch) as a separate service.
  controller:
    # Runs the image the `server` service builds. Building it here too makes Compose build
    # the same tag twice in parallel, and the second export fails with "already exists".
    image: truefoundry-server:latest
    pull_policy: never
    command: ['node', 'dist/controller-main.js']
    environment:
      NODE_ENV: production
      STANDALONE: 'false'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # The controller is its own container, so localhost would be itself; the
      # server answers in the network namespace published by `loopback`.
      SERVER_URL: http://loopback:8790
    env_file:
      - path: packages/trueforge/.env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    # Above GRACEFUL_TIMEOUT_SECONDS (30) so SIGKILL does not cut off loop drain.
    stop_grace_period: 35s
    restart: unless-stopped

  # Login profile. Start with `docker compose --profile login up --build` after
  # setting the OIDC_*, DEX_* and NODE_EXTRA_CA_CERTS values in
  # packages/trueforge/.env (docs/quickstart.mdx walks through it). The app
  # then shows a real sign-in screen backed by one local account, on Aman's own
  # sign-in service. Standalone also needs OIDC_ALLOWED_EMAILS (the owner).

  # One-shot: mints a self-signed certificate for https://localhost:5556 the
  # first time the profile runs. OIDC issuers must be HTTPS; the server trusts
  # this certificate through NODE_EXTRA_CA_CERTS, and the browser asks once.
  dex-tls:
    image: alpine/openssl:3.5.1
    profiles: ['login']
    entrypoint: ['sh', '-c']
    command:
      - |
        test -f /tls/dex.crt && exit 0
        openssl req -x509 -newkey rsa:2048 -nodes -days 825           -keyout /tls/dex.key -out /tls/dex.crt           -subj '/CN=localhost'           -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
        # Dex runs unprivileged; the key protects a loopback-only login.
        chmod 644 /tls/dex.key /tls/dex.crt
    volumes:
      - dex-tls:/tls

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    profiles: ['login']
    # Same network namespace as the server (see `loopback`), so the issuer
    # https://localhost:5556/dex is one URL for the browser and the server.
    network_mode: 'service:loopback'
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    volumes:
      - ./ops/compose/dex/config.yaml:/etc/dex/config.yaml:ro
      - dex-tls:/etc/dex/tls:ro
    env_file:
      - path: packages/trueforge/.env
        required: true
    depends_on:
      loopback:
        condition: service_started
      dex-tls:
        condition: service_completed_successfully
    # Dex's plain-HTTP telemetry listener serves /healthz; see config.yaml.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:5558/healthz']
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  # Between the app's `loopback` and the calendar connector only. Not internal: the connector reaches the calendar
  # server on the internet.
  calendar: {}

volumes:
  dex-tls:
  # The Email send list. Holds only addresses, never credentials.
  mail-policy:
  # Records which send list the Email sidecar loaded. Written by the sidecar, read by the server.
  mail-policy-status:
  # Mail metadata index (SQLite). Holds mail metadata at rest, never credentials.
  mail-email-data:
  # The Email account file, owned by the connector. Holds the app password; nothing else reads it.
  mail-account:
  # The Calendar login file, owned by the connector. Holds the app password; nothing else reads it.
  calendar-account:
  # Persistent Markdown memory files .
  memory-data:
  # Persistent persona knowledge libraries (SQLite per persona).
  persona-knowledge-data:
  # Persistent Whisper model weights for the aman-stt sidecar.
  stt-model-cache:
