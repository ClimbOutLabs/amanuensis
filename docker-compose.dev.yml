# Host-backed development infra. Project name keeps containers separate from
# docker-compose.yml. Host ports match packages/trueforge/.env defaults.
name: trueforge-dev

services:
  postgres:
    image: postgres:17
    env_file:
      - path: packages/trueforge/.env
        required: true
    # Loopback-only: this stack is for local use, and the port carries a database.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./data/dev/postgres:/var/lib/postgresql/data
    # -h forces a TCP probe; initdb's bootstrap server answers only on the
    # Unix socket. Kept in sync with docker-compose.yml.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Shared by all server replicas: carries executor peering (cross-replica
  # turn cancel via request-reply).
  redis:
    image: redis:7-alpine
    # Loopback-only: Redis runs unauthenticated and carries live peering traffic.
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Local speech-to-text sidecar for host `pnpm dev`; same build, image tag,
  # memory limit and thread count as docker-compose.yml (the image's own
  # HEALTHCHECK applies in both). The host-run server reaches it through the
  # published port via STT_URL in packages/trueforge/.env. Unlike the smoke
  # stack it has no cpuset pin: the host-run server cannot be pinned to a
  # disjoint core set, and a fixed range would stop `dev:infra` on hosts with
  # fewer than 20 cores.
  aman-stt:
    build:
      context: ops/aman-stt
    image: amanuensis-aman-stt:latest
    # Loopback-only: the sidecar has no authentication.
    ports:
      - '127.0.0.1:8001:8001'
    mem_limit: 2g
    environment:
      AMAN_STT_CPU_THREADS: '4'
      AMAN_STT_MODEL_DIR: /data/stt-cache
    volumes:
      # Project-scoped volume: this stack caches its own copy of the ~464 MB
      # model, separate from the smoke stack's.
      - stt-model-cache:/data/stt-cache
    restart: unless-stopped

  # Local text-to-speech sidecar for host `pnpm dev`; same build, image tag,
  # memory limit and thread count as docker-compose.yml. The host-run server
  # reaches it through the published port via TTS_URL in
  # packages/trueforge/.env. No cpuset pin, for the same reason as aman-stt.
  aman-tts:
    build:
      context: ops/aman-tts
    image: amanuensis-aman-tts:latest
    # Loopback-only: the sidecar has no authentication.
    ports:
      - '127.0.0.1:8002:8002'
    mem_limit: 1g
    environment:
      AMAN_TTS_CPU_THREADS: '4'
    restart: unless-stopped

volumes:
  # Persistent Whisper model weights for the aman-stt sidecar.
  stt-model-cache:
