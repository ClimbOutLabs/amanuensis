name: Model evals

# Runs real models against a throwaway eval-mode Aman: everyday tasks, safety traps and memory
# questions, graded by rule checks and a judge model. Each run adds to a score history kept as a
# run artifact, and the run fails when a model scores clearly worse than its last run.
on:
  schedule:
    # Mondays 10:41 UTC, off the hour, when scheduled runs start late.
    - cron: '41 10 * * 1'
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to compare, comma separated, as provider/model. Empty uses the weekly list.'
        required: false
        default: ''
      extra_token_factory_model:
        description: 'Optional extra Token Factory model id, e.g. deepseek-ai/DeepSeek-V3.2. It is then also named in models as tokenfactory/<its short name>.'
        required: false
        default: ''
      runs:
        description: 'Times to run each case (1 to 5).'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: model-evals
  cancel-in-progress: false

env:
  # The weekly comparison. Change this line to change which models run every Monday.
  WEEKLY_MODELS: 'tokenfactory/nemotron-3-super-120b-a12b,tokenfactory/nemotron-3-ultra-550b-a55b'
  # One fixed judge, so scores stay comparable from week to week.
  JUDGE_MODEL: 'tokenfactory/nemotron-3-ultra-550b-a55b'

jobs:
  model-evals:
    name: Compare models
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check that the model key is set
        env:
          HAS_KEY: ${{ secrets.MODEL_EVAL_NEBIUS_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != 'true' ]; then
            echo '::error::The model eval needs a Token Factory key. Add it as the repository secret MODEL_EVAL_NEBIUS_API_KEY, then run this workflow again.'
            exit 1
          fi

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The newest history from an earlier run, if one is still kept. Without one, this run starts it.
      - name: Fetch the score history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/history"
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow model-evals.yml --branch main --limit 20 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId'); do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name model-eval-history --dir "$RUNNER_TEMP/history" 2>/dev/null; then
              echo "Using the score history from run $run_id."
              break
            fi
          done

      - name: Run the model eval
        env:
          NEBIUS_API_KEY: ${{ secrets.MODEL_EVAL_NEBIUS_API_KEY }}
          TOKEN_FACTORY_MODEL: ${{ inputs.extra_token_factory_model }}
          MODELS: ${{ inputs.models || env.WEEKLY_MODELS }}
          RUNS: ${{ inputs.runs || '1' }}
          LABEL: ${{ github.event_name == 'schedule' && 'weekly' || 'on-demand' }}
        run: |
          if [ -z "$TOKEN_FACTORY_MODEL" ]; then unset TOKEN_FACTORY_MODEL; fi
          pnpm eval:models:fresh -- \
            --models "$MODELS" \
            --judge "$JUDGE_MODEL" \
            --runs "$RUNS" \
            --label "$LABEL" \
            --history "$RUNNER_TEMP/history/history.json" \
            --out "$RUNNER_TEMP/results"

      - name: Show the scores on the run page
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/results/summary.md" ]; then
            cat "$RUNNER_TEMP/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: model-eval-results
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep the score history
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: model-eval-history
          path: ${{ runner.temp }}/history/history.json
          if-no-files-found: ignore
          retention-days: 90
