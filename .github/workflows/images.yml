name: Images

# Publishes the three Aman images that the installer downloads. Kept out of ci.yml so that a tag push runs only this
# job, not the whole CI matrix.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Publish Aman images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute the image ids the installer looks for
        id: ids
        run: |
          # Same ids as installer/lib/release.sh source_id(): the first 12 characters of the commit for the app, and of
          # the tree for each subdirectory.
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "app=$(git rev-parse HEAD | cut -c1-12)"
            echo "stt=$(git rev-parse HEAD:ops/aman-stt | cut -c1-12)"
            echo "calendar=$(git rev-parse HEAD:ops/calendar-sidecar | cut -c1-12)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        id: app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_REF=${{ steps.ids.outputs.revision }}
          tags: ghcr.io/climboutlabs/aman-app:${{ steps.ids.outputs.app }}
          labels: |
            org.opencontainers.image.revision=${{ steps.ids.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push the speech-to-text image
        id: stt
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ops/aman-stt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/climboutlabs/aman-stt:${{ steps.ids.outputs.stt }}
          labels: |
            org.opencontainers.image.revision=${{ steps.ids.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push the calendar connector image
        id: calendar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ops/calendar-sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/climboutlabs/aman-calendar-caldav:${{ steps.ids.outputs.calendar }}
          labels: |
            org.opencontainers.image.revision=${{ steps.ids.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Summarize the pushed images
        run: |
          {
            echo "### Aman images"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| ghcr.io/climboutlabs/aman-app:${{ steps.ids.outputs.app }} | ${{ steps.app.outputs.digest }} |"
            echo "| ghcr.io/climboutlabs/aman-stt:${{ steps.ids.outputs.stt }} | ${{ steps.stt.outputs.digest }} |"
            echo "| ghcr.io/climboutlabs/aman-calendar-caldav:${{ steps.ids.outputs.calendar }} | ${{ steps.calendar.outputs.digest }} |"
          } >> "$GITHUB_STEP_SUMMARY"
