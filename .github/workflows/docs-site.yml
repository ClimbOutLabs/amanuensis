name: Docs site

# Builds the docs website from docs/ and the in-app help topics. A pull request only builds it, so a
# page that breaks the site shows up before merge; a push to main also publishes it on GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/trueforge/guide/topics/**'
      - 'docs-site/**'
      - 'scripts/build-docs-site.mjs'
      - 'tests/docs-site-build.test.mjs'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/trueforge/guide/topics/**'
      - 'docs-site/**'
      - 'scripts/build-docs-site.mjs'
      - 'tests/docs-site-build.test.mjs'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # A newer push replaces a pull request's build; a publish to main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: docs-site/requirements.txt

      # No pnpm install: the layout script and its tests use only Node itself.
      - name: Test the page layout
        run: npm run test:docs-site

      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt

      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: npm run docs:site:build

      - name: Keep the site for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site

  deploy:
    name: Publish docs site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
