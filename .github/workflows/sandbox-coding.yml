name: Sandbox coding

# Coding work in the real sandbox, with no model and no keys: Git history survives a full disk, npm and
# pip installs work, a project's own scripts run, long commands get their time, and the Sandbox switch
# lets new files through without a card. The sandbox is built from this checkout on every run, so the
# result is about the code here, not an image built earlier.
on:
  schedule:
    # Mondays 10:11 UTC, half an hour before the model eval, off the hour when scheduled runs start late.
    - cron: '11 10 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sandbox-coding.yml'

permissions:
  contents: read

concurrency:
  group: sandbox-coding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-coding:
    name: Coding in the sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner is thrown away after the job, so the per-slot disks are skipped and the soft disk
      # limit is what the disk check fills.
      - name: Build the sandbox from this checkout and start it
        run: pnpm sandbox:slots --fix --yes --no-hard-disk-limit --instance main

      - name: Run the coding checks
        run: pnpm test:sandbox-coding-live --instance main

      - name: Stop the sandbox
        if: always()
        run: pnpm sandbox:slots --down --purge --instance main
