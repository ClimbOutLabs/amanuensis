# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Groups batch compatible updates into one PR per ecosystem (and, for npm,
# one PR for minor/patch and one for security). Major npm bumps are ignored;
# bump those manually when ready. Updates that cannot share a group still open
# as individual PRs.

version: 2

# The chart's Postgres and Redis dependencies are OCI charts on Docker Hub
# (oci://registry-1.docker.io/bitnamicharts in charts/trueforge/Chart.yaml).
# The helm-registry type does not support OCI registries, so the host is
# declared as a docker-registry instead. The charts are public, so the entry
# carries no credentials; declaring the registry is what lets a Dependabot
# job reach the host at all.
#
# The helm job also checks the container images named in
# charts/trueforge/values.yaml, and those live on tfy.jfrog.io (the
# trueforge image, the alpine image, and the bitnamilegacy postgresql and
# redis images). That host allows anonymous pulls, as values.yaml records,
# so it is declared the same way with no credentials. Without it the job
# fails with private_source_authentication_failure on those images.
registries:
  dockerhub:
    type: docker-registry
    url: https://registry-1.docker.io
  jfrog:
    type: docker-registry
    url: https://tfy.jfrog.io

updates:
  # pnpm workspace — Dependabot uses the npm ecosystem for pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Fern-generated; maintainers regenerate rather than hand-bump deps.
    exclude-paths:
      - packages/trueforge-sdk/**
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Pinned at 8.68.0: 8.70.0's no-meaningless-void-operator flags this
      # codebase's void unusedParam; idiom (see codebase idiom).
      - dependency-name: 'typescript-eslint'
      # 0.56 breaks the frontend build through vite-plugin-monaco-editor-esm's
      # worker paths; hold both packages until the build is fixed.
      - dependency-name: monaco-editor
      - dependency-name: vite-plugin-monaco-editor-esm
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: helm
    directory: /charts/trueforge
    schedule:
      interval: weekly
    registries:
      - dockerhub
      - jfrog
    groups:
      helm:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /benchmark
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - '*'
